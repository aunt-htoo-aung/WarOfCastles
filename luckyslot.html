<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>War of Castle | Lucky Slot</title>
    <link rel="stylesheet" href="style/luckyslot-style.css" />
  </head>
  <body>
    <div class="main-content">
      <div class="title">Lucky Slot</div>
      <div class="container">
        <!-- Inside the .slot-machine div -->
        <div class="slot-machine">
          <!-- Victory Coin Display -->
          <div class="victory-display">
            Win: <span id="victoryCoins">0</span> 🪙
          </div>

          <div class="reels">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">⭐</div>
          </div>

          <!-- Betting Controls -->
          <div class="bet-container">
            <div class="input-box">
              <label for="betAmount">Bet:</label>
              <input type="number" id="betAmount" value="1000" min="1" />
              <div class="clear-btn">Clear</div>
            </div>
            <div class="amount-box">
              <div class="btn" data-amount="500">🪙 500</div>
              <div class="btn" data-amount="1000">🪙 1,000</div>
              <div class="btn" data-amount="5000">🪙 5,000</div>
              <div class="btn" data-amount="10000">🪙 10,000</div>
            </div>
          </div>

          <div class="result" id="result">Press SPIN!</div>
          <button class="spin-btn" id="spinBtn">SPIN</button>
        </div>

        <!-- Ensure currency-box has a span for the total balance -->
        <div class="currency-box">
          <p>Balance: <span id="totalBalance">100</span> 🪙</p>
        </div>
      </div>
      <a href="landing.html" class="back-btn">Back To Menu</a>
    </div>
    <!-- <div class="currency-box">
      <p></p>
    </div> -->
  </body>
  <script src="script/common-script.js"></script>
  <script src="script/luckyslot-script.js"></script>
</html>
