<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>War Of Castle | Profile</title>
    <link rel="stylesheet" href="style/profile-style.css" />
  </head>
  <body>
    <main class="game-container">
      <h1 class="game-title">War Of Castle</h1>

      <div class="main-layout">
        <section class="profile-preview">
          <div class="avatar-circle">
            <span>Avatar</span>
          </div>
          <h2 class="preview-name">Name</h2>
        </section>

        <section class="creation-card">
          <h3>Create Your Profile</h3>

          <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter Your Name..." />
          </div>

          <div class="avatar-selector">
            <p>Choose Your Avatar</p>
            <div class="carousel">
              <button class="nav-btn">&lt;</button>

              <div class="avatars"></div>

              <button class="nav-btn">&gt;</button>
            </div>
          </div>
          <div class="btn-group">
            <button class="random-btn">Random Avatar</button>
            <button class="save-btn">Save Profile</button>
          </div>
        </section>
      </div>
    </main>
    <script src="script/profile-script.js"></script>
  </body>
</html>
