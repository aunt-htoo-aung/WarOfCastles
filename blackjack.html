<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>War of Castle | Black Jack</title>
    <link rel="stylesheet" href="style/blackjack-style.css" />
  </head>
  <body>
    <div class="main-content">
      <div class="title">Black Jack</div>
      <div class="container">
        <div class="table">
          <div class="section">
            <h2>Dealer</h2>
            <div id="bot-cards" class="cards"></div>
            <p>Total: <span id="bot-total">0</span></p>
          </div>

          <div class="section">
            <h2>Player</h2>
            <div id="player-cards" class="cards"></div>
            <p>Total: <span id="player-total">0</span></p>
          </div>
        </div>
        <div class="bet-container">
          <h2 id="result"></h2>
          <div class="victory-display">
            Win: <span id="victoryCoins">0</span> 🪙
          </div>
          <div class="buttons">
            <button id="hitBtn" onclick="hit()">Hit</button>
            <button id="standBtn" onclick="stand()">Stand</button>
            <button id="startBtn" onclick="placeBet()">Play</button>
          </div>
          <div class="input-box">
            <label for="betAmount">Bet:</label>
            <input type="number" id="betAmount" value="1000" min="1" />
            <div class="clear-btn">Clear</div>
          </div>
          <div class="amount-box">
            <div class="btn" data-amount="500">🪙 500</div>
            <div class="btn" data-amount="1000">🪙 1,000</div>
            <div class="btn" data-amount="5000">🪙 5,000</div>
            <div class="btn" data-amount="10000">🪙 10,000</div>
          </div>
        </div>
        <!-- Ensure currency-box has a span for the total balance -->
        <div class="currency-box">
          <p>Balance: <span id="totalBalance">100</span> 🪙</p>
        </div>
      </div>
      <a href="landing.html" class="back-btn">Back To Menu</a>
    </div>
    <!-- <div class="currency-box">
      <p></p>
    </div> -->
  </body>
  <script src="script/common-script.js"></script>
  <script src="script/blackjack-script.js"></script>
</html>
